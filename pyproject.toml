[project]
name = "crypto-intel"
version = "0.1.0"
description = "Paper-only crypto trading information system with asset-class strategies and security controls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AIxTech research harness" }]

[project.scripts]
crypto-intel = "crypto_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]
ignore = ["S101"]

[tool.coverage.run]
source = ["crypto_intel"]
branch = false
